name: Windows build

# Builds PDFtoPrinterNative.exe with build.bat. The version comes from MinVer
# (the latest vX.Y.Z tag plus commit height) and is stamped into the exe's
# version resource and the artifact name.
#
# Runs on:
#   - pushes to main and pull requests: compile check only
#   - manually from the Actions tab: uploads the build as an artifact. The
#     input takes a branch, tag or SHA, or a PR number to build that PR merged
#     into the current tip of its base (versioned from the PR's own branch,
#     e.g. 1.1.1-alpha.0.3+pr.1)
#   - a vX.Y.Z tag push: publishes a GitHub Release with the build attached
#     (tags with a -suffix, e.g. v1.2.0-beta.1, are marked pre-release)

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, SHA, or PR number (blank = the selected branch)
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    concurrency:
      group: build-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read    # look up a PR's base branch for manual PR builds
    outputs:
      version: ${{ steps.minver.outputs.version }}
    env:
      # Only these builds are downloaded; push and PR builds are a compile check.
      PACKAGE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Resolve ref
        id: ref
        shell: pwsh
        env:
          INPUT_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A bare number means "that PR, merged into its base": check out the
          # base branch here and merge the PR below. (GitHub's refs/pull/N/merge
          # is only refreshed now and then, so it can lag behind the base.)
          if ($env:INPUT_REF -match '^\d+$') {
            $base = gh pr view $env:INPUT_REF -R $env:GITHUB_REPOSITORY --json baseRefName -q .baseRefName
            if (-not $base) { throw "PR #$($env:INPUT_REF) not found" }
            "ref=$base"             >> $env:GITHUB_OUTPUT
            "pr=$($env:INPUT_REF)"  >> $env:GITHUB_OUTPUT
          } else {
            "ref=$($env:INPUT_REF)" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0     # MinVer needs the history and tags
          ref: ${{ steps.ref.outputs.ref }}

      - name: Merge PR into its base
        if: steps.ref.outputs.pr != ''
        shell: pwsh
        env:
          PR: ${{ steps.ref.outputs.pr }}
        run: |
          git fetch --quiet origin "pull/$env:PR/head"
          git -c user.name=ci -c user.email=ci@localhost merge --no-ff --no-edit FETCH_HEAD
          if ($LASTEXITCODE) { throw "PR #$env:PR does not merge cleanly into its base" }

      - name: Version (MinVer)
        id: minver
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || steps.ref.outputs.pr }}
        run: |
          dotnet tool install --global minver-cli --version 8.0.0
          # PR builds compile the merge commit, but version from the PR's own
          # branch so each push bumps the height, then tag it with the PR number.
          $prHead = ((git rev-list --parents -n 1 HEAD) -split ' ')[2]
          if ($env:PR_NUMBER -and $prHead) {
            $dir = Join-Path $env:RUNNER_TEMP prhead
            git worktree add --quiet --detach $dir $prHead
            Push-Location $dir
            $v = (minver --tag-prefix v --verbosity warn).Trim() + "+pr.$env:PR_NUMBER"
            Pop-Location
            git worktree remove --force $dir
          } else {
            $v = (minver --tag-prefix v --verbosity warn).Trim()
          }
          $m = [regex]::Match($v, '^(\d+)\.(\d+)\.(\d+)')
          "version=$v" >> $env:GITHUB_OUTPUT
          "VER_STRING=$v"               >> $env:GITHUB_ENV
          "VER_MAJOR=$($m.Groups[1])"   >> $env:GITHUB_ENV
          "VER_MINOR=$($m.Groups[2])"   >> $env:GITHUB_ENV
          "VER_PATCH=$($m.Groups[3])"   >> $env:GITHUB_ENV
          Write-Host "Version: $v"

      - name: Build
        shell: cmd
        run: build.bat

      - name: Collect artifact
        if: env.PACKAGE == 'true'
        shell: pwsh
        run: |
          $pdfium = if (Test-Path pdfium\VERSION) { (Get-Content pdfium\VERSION) -join ' ' } else { 'unknown' }
          Write-Host "PDFium: $pdfium"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item PDFtoPrinterNative.exe dist\PDFtoPrinter.exe
          Copy-Item PDFtoPrinterNative.exe, PDFtoPrinterSelect.exe, PDFtoPrinterSelectGUI.exe, pdfium.dll, README.md, LICENSE dist\
          Copy-Item -Recurse examples dist\examples
          Copy-Item pdfium\LICENSE dist\LICENSE.pdfium -ErrorAction SilentlyContinue
          $info = "version $env:VER_STRING`ncommit $(git rev-parse HEAD)"
          # On a PR merge commit, also record the PR branch's own commit.
          $prHead = ((git rev-list --parents -n 1 HEAD) -split ' ')[2]
          if ($prHead) { $info += "`nPR head $prHead" }
          "$info`nPDFium $pdfium" | Set-Content dist\BUILDINFO.txt
          Get-ChildItem dist -Recurse | Format-Table Length, FullName

      - name: Upload artifact
        if: env.PACKAGE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: PDFtoPrinter-${{ steps.minver.outputs.version }}-win-x64
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release and upload its files
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: PDFtoPrinter-${{ needs.build.outputs.version }}-win-x64
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          zip="PDFtoPrinter-$VERSION-win-x64.zip"
          (cd dist && zip -qr "../$zip" .)
          # The zip, plus the programs and DLL on their own as earlier releases had.
          files=("$zip" dist/PDFtoPrinter.exe dist/PDFtoPrinterNative.exe
                 dist/PDFtoPrinterSelect.exe dist/PDFtoPrinterSelectGUI.exe dist/pdfium.dll)
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"
          else
            pre=(); [[ "$TAG" == *-* ]] && pre=(--prerelease)
            gh release create "$TAG" "${files[@]}" --title "$TAG" --generate-notes "${pre[@]}" -R "$GITHUB_REPOSITORY"
          fi
